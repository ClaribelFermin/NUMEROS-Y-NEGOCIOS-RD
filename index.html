<style>:root{

button,input,select,textarea{font:inherit;color:inherit}

@media (max-width:760px){

  .lines,.lines tbody{display:block}
  .lines tr.lrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:#fbfdfc}
  .lines tr.lrow td{display:block;padding:0;border:0;background:transparent!important}
  .lines tr.lrow td:first-child{grid-column:1/-1}
  .lines tr.lrow td[data-l]::before{content:attr(data-l);display:block;font-size:12px;font-weight:700;color:var(--navy);margin-bottom:2px}
  .lines tr.lrow td.t{text-align:left;align-self:end}

}
@media (max-width:900px){
  #menuBtn{display:block}
  nav#nav{transform:translateX(-102%);transition:transform .2s;box-shadow:4px 0 18px rgba(0,0,0,.2);width:min(82vw,290px)}

  main#main{margin-left:0;padding:70px 12px 30px}
  .two{grid-template-columns:1fr}
  h1{font-size:21px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi .v{font-size:18px}
  .charts{grid-template-columns:1fr}
  .modal-bg{padding:10px 6px}
}
@media (max-width:480px){ .kpis{grid-template-columns:1fr} input.search{min-width:0;width:100%} }
@media print{

  body{background:#fff;font-size:12px}

  .card,.kpi,.chart{border:0;padding:0}
  th{background:#eee!important;color:#000!important;-webkit-print-color-adjust:exact}
  .hide-reg .reg{visibility:hidden}
  tr{page-break-inside:avoid}
}

<header class="top"><button id="menuBtn" aria-label="Abrir menú">☰</button><div class="brand"><b>Mi Negocio Inteligente</b><small>NÚMEROS Y NEGOCIOS RD</small></div><div class="grow"></div><div id="saveState"></div></header>

<script>/* ============================================================
   MI NEGOCIO INTELIGENTE · Motor contable
   NÚMEROS Y NEGOCIOS RD
   Herramienta educativa y de control interno. No es un sistema
   fiscal ni contable certificado.
   Método de inventario: costo promedio ponderado móvil.
   ============================================================ */
const MNI = (function () {
  'use strict';

  /* ---------- utilidades ---------- */
  const r2 = x => Math.round(x * 100 + (x >= 0 ? 1e-9 : -1e-9)) / 100;
  const pad = n => String(n).padStart(2, '0');
  const fmtD = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const todayStr = () => fmtD(new Date());
  const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
  const addDays = (s, n) => { const d = parseD(s); d.setUTCDate(d.getUTCDate() + n); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); };
  const diffDays = (a, b) => Math.round((parseD(a) - parseD(b)) / 86400000);
  const monthStart = s => s.slice(0, 7) + '-01';
  const monthEnd = s => { const [y, m] = s.split('-').map(Number); const d = new Date(Date.UTC(y, m, 0)); return y + '-' + pad(m) + '-' + pad(d.getUTCDate()); };
  const BEGIN = '0000-00-00', END = '9999-12-31';
  const sum = (arr, f) => arr.reduce((a, x) => a + (f ? f(x) : x), 0);

  /* ---------- estado inicial ---------- */
  function emptyState() {
    return {
      version: 1, seq: 1,
      config: {
        negocio: 'Mi Negocio', propietario: '', fechaInicio: todayStr(),
        cajaInicial: 0, bancoInicial: 0, equipos: 0,
        diasAlertaVence: 30, diasAlertaPago: 7,
        itbis: { activo: false, incluido: true, tasaGeneral: 18, tasaReducida: 16 },
      },
      productos: [], suplidores: [], compras: [], ventas: [], devoluciones: [], ajustes: [],
      gastos: [], pagos: [], cobros: [], movimientos: [], cierres: [], cxpIni: [], cxcIni: [],
      conteo: { fecha: '', items: {} },
    };
  }
  const nextId = S => S.seq++;

  /* ---------- ITBIS (parámetro opcional) ---------- */
  // comps: [{v, s}] con s = +1 / -1. Devuelve bases por componente, base, itbis y total.
  function mk(comps, rate, incl) {
    const net = sum(comps, c => c.s * c.v);
    if (!rate) return { bases: comps.map(c => r2(c.v)), base: r2(net), itbis: 0, total: r2(net) };
    if (incl) {
      const bases = comps.map(c => r2(c.v / (1 + rate)));
      const base = r2(sum(comps, (c) => 0) + comps.reduce((a, c, i) => a + c.s * bases[i], 0));
      const total = r2(net);
      return { bases, base, itbis: r2(total - base), total };
    }
    const bases = comps.map(c => r2(c.v));
    const base = r2(net);
    const total = r2(base * (1 + rate));
    return { bases, base, itbis: r2(total - base), total };
  }

  /* ============================================================
     CÁLCULO PRINCIPAL (reproduce todos los movimientos en orden)
     ============================================================ */
  function compute(S) {
    const cfg = S.config, it = cfg.itbis;
    const P = {}; S.productos.forEach(p => { P[p.codigo] = p; });
    const rateOf = code => {
      if (!it.activo) return 0;
      const p = P[code];
      if (p && p.itbis === 'exento') return 0;
      if (p && p.itbis === 'reducida') return it.tasaReducida / 100;
      return it.tasaGeneral / 100;
    };
    const incl = !!(it.activo && it.incluido);
    const costoBase = p => { const r = rateOf(p.codigo); return (r && incl) ? r2(p.costo / (1 + r)) : p.costo; };
    const R = { P, errors: [], K: {}, ledger: [], itbisEv: [], rateOf, incl };

    /* --- compras --- */
    R.compras = S.compras.map(c => {
      const lineas = c.lineas.map(l => {
        const rate = rateOf(l.codigo);
        const gross = r2(l.cant * l.costo);
        const m = mk([{ v: gross, s: 1 }, { v: l.descuento || 0, s: -1 }, { v: l.adicional || 0, s: 1 }], rate, incl);
        return { ...l, gross, gB: m.bases[0], dB: m.bases[1], aB: m.bases[2], base: m.base, itbis: m.itbis, total: m.total };
      });
      return { ...c, lineas, base: r2(sum(lineas, l => l.base)), itbis: r2(sum(lineas, l => l.itbis)), total: r2(sum(lineas, l => l.total)) };
    });
    const compraById = {}; R.compras.forEach(c => { compraById[c.id] = c; });

    /* --- ventas --- */
    R.ventas = S.ventas.map(v => {
      const lineas = v.lineas.map(l => {
        const rate = rateOf(l.codigo);
        const gross = r2(l.cant * l.precio);
        const m = mk([{ v: gross, s: 1 }, { v: l.descuento || 0, s: -1 }], rate, incl);
        return { ...l, gross, gB: m.bases[0], dB: m.bases[1], base: m.base, itbis: m.itbis, total: m.total, cost: 0 };
      });
      return { ...v, lineas, base: r2(sum(lineas, l => l.base)), itbis: r2(sum(lineas, l => l.itbis)), total: r2(sum(lineas, l => l.total)) };
    });
    const ventaById = {}; R.ventas.forEach(v => { ventaById[v.id] = v; });

    /* --- eventos de inventario --- */
    const ev = [];
    S.productos.forEach(p => ev.push({ k: 'ini', date: BEGIN, pri: 0, id: 0, p }));
    R.compras.forEach(c => c.lineas.forEach(l => ev.push({ k: 'compra', date: c.fecha, pri: 1, id: c.id, c, l })));
    R.ventas.forEach(v => v.lineas.forEach(l => ev.push({ k: 'venta', date: v.fecha, pri: 2, id: v.id, v, l })));
    R.devs = [];
    S.devoluciones.forEach(d => {
      if (d.tipo === 'venta') {
        const v = ventaById[d.refId]; const l = v && v.lineas.find(x => x.codigo === d.codigo);
        if (!l) { R.errors.push('Devolución sin venta de origen (id ' + d.id + ')'); return; }
        const frac = d.cant / l.cant;
        const base = r2(l.base * frac), total = r2(l.total * frac);
        const dv = { ...d, v, l, base, total, itbis: r2(total - base), cost: 0 };
        R.devs.push(dv); ev.push({ k: 'devventa', date: d.fecha, pri: 3, id: d.id, d: dv });
      } else {
        const c = compraById[d.refId]; const l = c && c.lineas.find(x => x.codigo === d.codigo);
        if (!l) { R.errors.push('Devolución sin compra de origen (id ' + d.id + ')'); return; }
        const frac = d.cant / l.cant;
        const base = r2(l.base * frac), total = r2(l.total * frac);
        const dv = { ...d, c, l, base, total, itbis: r2(total - base) };
        R.devs.push(dv); ev.push({ k: 'devcompra', date: d.fecha, pri: 4, id: d.id, d: dv });
      }
    });
    R.ajs = S.ajustes.map(a => ({ ...a, cost: 0 }));
    R.ajs.forEach(a => ev.push({ k: 'ajuste', date: a.fecha, pri: 5, id: a.id, a }));
    ev.sort((x, y) => x.date < y.date ? -1 : x.date > y.date ? 1 : (x.pri - y.pri) || (x.id - y.id));

    const st = {};
    S.productos.forEach(p => { st[p.codigo] = { q: 0, v: 0, last: costoBase(p) }; R.K[p.codigo] = []; });
    const snap = (code, e, tipo, dq, dv) => {
      const s = st[code];
      if (s.q > 1e-9) s.last = s.v / s.q;
      R.K[code].push({ date: e.date, tipo, id: e.id, dq, dv, q: s.q, v: s.v });
    };
    const salida = (code, qty) => {
      const s = st[code];
      const avg = s.q > 1e-9 ? s.v / s.q : s.last;
      const cost = (s.q > 1e-9 && Math.abs(qty - s.q) < 1e-9) ? r2(s.v) : r2(qty * avg);
      s.q -= qty; s.v -= cost;
      return cost;
    };
    ev.forEach(e => {
      if (e.k === 'ini') {
        const p = e.p, s = st[p.codigo]; const q = Number(p.existencia) || 0;
        s.q = q; s.v = r2(q * costoBase(p)); snap(p.codigo, e, 'ini', q, s.v);
      } else if (e.k === 'compra') {
        if (!st[e.l.codigo]) { R.errors.push('Compra con producto inexistente ' + e.l.codigo); return; }
        const s = st[e.l.codigo]; s.q += e.l.cant; s.v += e.l.base;
        snap(e.l.codigo, e, 'compra', e.l.cant, e.l.base);
        R.itbisEv.push({ date: e.date, delta: -e.l.itbis, id: e.id });
      } else if (e.k === 'venta') {
        if (!st[e.l.codigo]) { R.errors.push('Venta con producto inexistente ' + e.l.codigo); return; }
        const cost = salida(e.l.codigo, e.l.cant); e.l.cost = cost;
        snap(e.l.codigo, e, 'venta', -e.l.cant, -cost);
        R.itbisEv.push({ date: e.date, delta: e.l.itbis, id: e.id });
      } else if (e.k === 'devventa') {
        const d = e.d, s = st[d.codigo]; const frac = d.cant / d.l.cant;
        d.cost = r2(d.l.cost * frac);
        s.q += d.cant; s.v += d.cost;
        snap(d.codigo, e, 'devventa', d.cant, d.cost);
        R.itbisEv.push({ date: e.date, delta: -d.itbis, id: e.id });
      } else if (e.k === 'devcompra') {
        const d = e.d, s = st[d.codigo];
        s.q -= d.cant; s.v -= d.base;
        snap(d.codigo, e, 'devcompra', -d.cant, -d.base);
        R.itbisEv.push({ date: e.date, delta: d.itbis, id: e.id });
      } else if (e.k === 'ajuste') {
        const a = e.a; if (!st[a.codigo]) { R.errors.push('Ajuste con producto inexistente ' + a.codigo); return; }
        const s = st[a.codigo];
        if (a.cant < 0) {
          const cost = salida(a.codigo, -a.cant); a.cost = cost; a.loss = cost;
          snap(a.codigo, e, a.tipo === 'Ajuste por conteo' ? 'ajuste' : 'merma', a.cant, -cost);
        } else {
          const avg = s.q > 1e-9 ? s.v / s.q : s.last; const val = r2(a.cant * avg);
          s.q += a.cant; s.v += val; a.cost = val; a.loss = -val;
          snap(a.codigo, e, 'ajuste', a.cant, val);
        }
      }
    });
    R.st = st;

    /* --- cuentas por pagar / por cobrar (documentos) --- */
    R.cxp = [];
    R.compras.forEach(c => { if (c.forma === 'Crédito') R.cxp.push({ key: 'C' + c.id, tipo: 'compra', compraId: c.id, suplidor: c.suplidor, factura: c.factura, fecha: c.fecha, vencimiento: c.vencimiento, total: c.total }); });
    S.cxpIni.forEach(x => R.cxp.push({ key: 'SI' + x.id, tipo: 'saldo inicial', suplidor: x.suplidor, factura: x.factura, fecha: x.fecha, vencimiento: x.vencimiento, total: x.monto }));
    R.cxc = [];
    R.ventas.forEach(v => { if (v.forma === 'Crédito') R.cxc.push({ key: 'V' + v.id, tipo: 'venta', ventaId: v.id, cliente: v.cliente, operacion: v.operacion, fecha: v.fecha, vencimiento: v.vencimiento, total: v.total }); });
    S.cxcIni.forEach(x => R.cxc.push({ key: 'CI' + x.id, tipo: 'saldo inicial', cliente: x.cliente, operacion: x.operacion, fecha: x.fecha, vencimiento: x.vencimiento, total: x.monto }));

    /* --- libro de caja y bancos --- */
    const L = R.ledger; let ord = 0;
    const add = (date, concepto, ent, sal, tipo, medio, ref) => {
      if (!ent && !sal) return;
      L.push({ date, concepto, entrada: r2(ent || 0), salida: r2(sal || 0), tipo, medio, cuenta: medio === 'Efectivo' ? 'Caja' : 'Banco', ref: ref || '', o: ord++ });
    };
    add(BEGIN, 'Saldo inicial de caja', cfg.cajaInicial, 0, 'Saldo inicial', 'Efectivo');
    add(BEGIN, 'Saldo inicial de banco', cfg.bancoInicial, 0, 'Saldo inicial', 'Banco');
    R.ventas.forEach(v => { if (v.forma !== 'Crédito') add(v.fecha, 'Venta ' + v.operacion + (v.cliente ? ' · ' + v.cliente : ''), v.total, 0, 'Venta', v.forma === 'Efectivo' ? 'Efectivo' : 'Banco', 'V' + v.id); });
    R.compras.forEach(c => { if (c.forma === 'Contado') add(c.fecha, 'Compra factura ' + c.factura + ' · ' + c.suplidor, 0, c.total, 'Compra', c.medio || 'Efectivo', 'C' + c.id); });
    S.cobros.forEach(c => { const d = R.cxc.find(x => x.key === c.docKey); add(c.fecha, 'Cobro ' + (d ? d.cliente + ' · ' + d.operacion : ''), c.monto, 0, 'Cobro', c.medio, c.docKey); });
    S.pagos.forEach(p => { const d = R.cxp.find(x => x.key === p.docKey); add(p.fecha, 'Pago ' + (d ? d.suplidor + ' · fact. ' + d.factura : ''), 0, p.monto, 'Pago a suplidor', p.medio, p.docKey); });
    R.devs.forEach(d => {
      if (d.destino === 'Deuda') return;
      if (d.tipo === 'venta') add(d.fecha, 'Devolución de venta ' + d.v.operacion, 0, d.total, 'Devolución de venta', d.destino);
      else add(d.fecha, 'Devolución de compra fact. ' + d.c.factura, d.total, 0, 'Devolución de compra', d.destino);
    });
    S.gastos.forEach(g => add(g.fecha, g.concepto + ' (' + g.categoria + ')', 0, g.monto, 'Gasto', g.medio));
    const MOV = {
      aporte: ['Aporte del dueño', 1], retiro: ['Retiro del dueño', -1], prestamo: ['Préstamo recibido', 1],
      pago_prestamo: ['Pago de préstamo', -1], otro_ingreso: ['Otro ingreso', 1], otro_gasto: ['Otro gasto', -1], pago_itbis: ['Pago de ITBIS', -1],
    };
    S.movimientos.forEach(m => {
      const medio = m.cuenta === 'Caja' ? 'Efectivo' : 'Banco';
      if (m.tipo === 'deposito') { add(m.fecha, m.concepto || 'Depósito a banco', 0, m.monto, 'Depósito a banco', 'Efectivo'); add(m.fecha, m.concepto || 'Depósito a banco', m.monto, 0, 'Depósito a banco', 'Banco'); }
      else if (m.tipo === 'retiro_banco') { add(m.fecha, m.concepto || 'Retiro de banco', 0, m.monto, 'Retiro de banco', 'Banco'); add(m.fecha, m.concepto || 'Retiro de banco', m.monto, 0, 'Retiro de banco', 'Efectivo'); }
      else { const [t, s] = MOV[m.tipo]; add(m.fecha, m.concepto || t, s > 0 ? m.monto : 0, s < 0 ? m.monto : 0, t, medio); }
      if (m.tipo === 'pago_itbis') R.itbisEv.push({ date: m.fecha, delta: -m.monto, id: m.id });
    });
    L.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.o - b.o);

    R.inv0 = sum(S.productos, p => R.K[p.codigo][0] ? R.K[p.codigo][0].v : 0);
    return R;
  }

  /* ---------- consultas ---------- */
  function invAt(R, code, date, strict) {
    const arr = R.K[code] || []; let q = 0, v = 0;
    for (const s of arr) { if (strict ? s.date < date : s.date <= date) { q = s.q; v = s.v; } else break; }
    return { q, v };
  }
  const invTotal = (R, date, strict) => r2(Object.keys(R.K).reduce((a, c) => a + invAt(R, c, date, strict).v, 0));
  const avgCost = (R, code, date) => {
    const s = invAt(R, code, date || END); const p = R.P[code];
    if (s.q > 1e-9) return s.v / s.q;
    return R.st[code] ? R.st[code].last : (p ? p.costo : 0);
  };
  const ledgerBal = (R, cuenta, end) => r2(R.ledger.reduce((a, e) => (e.date <= end && (!cuenta || e.cuenta === cuenta)) ? a + e.entrada - e.salida : a, 0));

  function docSaldo(S, R, doc, tipo, asOf) {
    if (doc.fecha > asOf) return { saldo: 0, abonos: 0, vigente: false };
    let abonos;
    if (tipo === 'cxp') {
      abonos = sum(S.pagos.filter(p => p.docKey === doc.key && p.fecha <= asOf), p => p.monto)
        + (doc.compraId ? sum(R.devs.filter(d => d.tipo === 'compra' && d.destino === 'Deuda' && d.refId === doc.compraId && d.fecha <= asOf), d => d.total) : 0);
    } else {
      abonos = sum(S.cobros.filter(p => p.docKey === doc.key && p.fecha <= asOf), p => p.monto)
        + (doc.ventaId ? sum(R.devs.filter(d => d.tipo === 'venta' && d.destino === 'Deuda' && d.refId === doc.ventaId && d.fecha <= asOf), d => d.total) : 0);
    }
    abonos = r2(abonos);
    return { saldo: r2(doc.total - abonos), abonos, vigente: true };
  }
  function docsAt(S, R, tipo, asOf, hoy) {
    const list = tipo === 'cxp' ? R.cxp : R.cxc;
    return list.map(d => {
      const s = docSaldo(S, R, d, tipo, asOf);
      let estado = 'Pendiente';
      if (s.saldo <= 0.005) estado = 'Pagada';
      else if (d.vencimiento && d.vencimiento < hoy) estado = 'Vencida';
      else if (s.abonos > 0) estado = 'Abonada';
      return { ...d, ...s, estado, dias: d.vencimiento ? diffDays(d.vencimiento, hoy) : null };
    }).filter(d => d.vigente);
  }
  const itbisBalance = (R, end) => r2(R.itbisEv.reduce((a, e) => e.date <= end ? a + e.delta : a, 0));

  /* ---------- Estado de resultados ---------- */
  function resultados(S, R, start, end) {
    const inR = d => d >= start && d <= end;
    const vs = R.ventas.filter(v => inR(v.fecha));
    const cs = R.compras.filter(c => inR(c.fecha));
    const dvs = R.devs.filter(d => d.tipo === 'venta' && inR(d.fecha));
    const dcs = R.devs.filter(d => d.tipo === 'compra' && inR(d.fecha));
    const ventasBrutas = r2(sum(vs, v => sum(v.lineas, l => l.gB)));
    const descVentas = r2(sum(vs, v => sum(v.lineas, l => l.dB)));
    const devVentas = r2(sum(dvs, d => d.base));
    const ventasNetas = r2(ventasBrutas - descVentas - devVentas);
    const comprasBrutas = r2(sum(cs, c => sum(c.lineas, l => l.gB)));
    const descCompras = r2(sum(cs, c => sum(c.lineas, l => l.dB)));
    const adicionales = r2(sum(cs, c => sum(c.lineas, l => l.aB)));
    const devCompras = r2(sum(dcs, d => d.base));
    const comprasNetas = r2(comprasBrutas - descCompras + adicionales - devCompras);
    // Si el período empieza desde el origen, el inventario inicial es el cargado en el catálogo de productos
    const invIni = start <= BEGIN ? R.inv0 : invTotal(R, start, true), invFin = invTotal(R, end, false);
    const costoVentas = r2(invIni + comprasNetas - invFin);
    // control por movimiento: costo vendido + pérdidas y ajustes
    const cmvVendido = r2(sum(vs, v => sum(v.lineas, l => l.cost)) - sum(dvs, d => d.cost));
    const ajs = R.ajs.filter(a => inR(a.fecha));
    const perdidas = r2(sum(ajs.filter(a => a.tipo !== 'Ajuste por conteo' && a.cant < 0), a => a.loss));
    const ajConteo = r2(sum(ajs.filter(a => !(a.tipo !== 'Ajuste por conteo' && a.cant < 0)), a => a.loss));
    const costoDirecto = r2(cmvVendido + perdidas + ajConteo);
    const beneficioBruto = r2(ventasNetas - costoVentas);
    const gs = S.gastos.filter(g => inR(g.fecha));
    const porCat = {}; gs.forEach(g => { porCat[g.categoria] = r2((porCat[g.categoria] || 0) + g.monto); });
    const gastosOp = r2(sum(gs, g => g.monto));
    const gastosFijos = r2(sum(gs.filter(g => g.tipo === 'Fijo'), g => g.monto));
    const gastosVariables = r2(gastosOp - gastosFijos);
    const resultadoOp = r2(beneficioBruto - gastosOp);
    const ms = S.movimientos.filter(m => inR(m.fecha));
    const otrosIngresos = r2(sum(ms.filter(m => m.tipo === 'otro_ingreso'), m => m.monto));
    const og = ms.filter(m => m.tipo === 'otro_gasto');
    const impuestos = r2(sum(og.filter(m => m.categoria === 'Impuestos'), m => m.monto));
    const otrosGastos = r2(sum(og, m => m.monto) - impuestos);
    const resultadoNeto = r2(resultadoOp + otrosIngresos - otrosGastos - impuestos);
    return {
      start, end, ventasBrutas, descVentas, devVentas, ventasNetas, comprasBrutas, descCompras, adicionales, devCompras, comprasNetas,
      invIni, invFin, costoVentas, cmvVendido, perdidas, ajConteo, costoDirecto, difControl: r2(costoVentas - costoDirecto),
      beneficioBruto, margenBruto: ventasNetas ? beneficioBruto / ventasNetas : 0, porCat, gastosOp, gastosFijos, gastosVariables,
      resultadoOp, otrosIngresos, otrosGastos, impuestos, resultadoNeto,
    };
  }

  /* ---------- Balance (situación financiera) ---------- */
  function balance(S, R, end, hoy) {
    const cfg = S.config;
    const caja = ledgerBal(R, 'Caja', end), banco = ledgerBal(R, 'Banco', end);
    const cxc = r2(sum(docsAt(S, R, 'cxc', end, hoy), d => d.saldo));
    const cxp = r2(sum(docsAt(S, R, 'cxp', end, hoy), d => d.saldo));
    const inventario = invTotal(R, end, false);
    const equipos = Number(cfg.equipos) || 0;
    const itb = itbisBalance(R, end);
    const itbisFavor = itb < 0 ? r2(-itb) : 0, itbisPagar = itb > 0 ? itb : 0;
    const prestamos = r2(sum(S.movimientos.filter(m => m.fecha <= end && m.tipo === 'prestamo'), m => m.monto) - sum(S.movimientos.filter(m => m.fecha <= end && m.tipo === 'pago_prestamo'), m => m.monto));
    const activos = r2(caja + banco + cxc + inventario + equipos + itbisFavor);
    const pasivos = r2(cxp + prestamos + itbisPagar);
    const capitalInicial = r2((Number(cfg.cajaInicial) || 0) + (Number(cfg.bancoInicial) || 0) + R.inv0 + equipos + sum(S.cxcIni, x => x.monto) - sum(S.cxpIni, x => x.monto));
    const aportes = r2(sum(S.movimientos.filter(m => m.fecha <= end && m.tipo === 'aporte'), m => m.monto));
    const retiros = r2(sum(S.movimientos.filter(m => m.fecha <= end && m.tipo === 'retiro'), m => m.monto));
    const utilidadAcum = resultados(S, R, BEGIN, end).resultadoNeto;
    const patrimonio = r2(capitalInicial + aportes - retiros + utilidadAcum);
    return { end, caja, banco, cxc, inventario, equipos, itbisFavor, activos, cxp, prestamos, itbisPagar, pasivos, capitalInicial, aportes, retiros, utilidadAcum, patrimonio, diferencia: r2(activos - pasivos - patrimonio), cuadra: Math.abs(activos - pasivos - patrimonio) < 0.05 };
  }

  /* ---------- Control de inventario por período ---------- */
  function inventarioResumen(S, R, start, end) {
    return S.productos.map(p => {
      const arr = R.K[p.codigo];
      const inR = e => e.date >= start && e.date <= end && e.tipo !== 'ini';
      const evs = arr.filter(inR);
      const qIni = invAt(R, p.codigo, start, true).q;
      const entradas = sum(evs.filter(e => e.tipo === 'compra'), e => e.dq);
      const salidas = -sum(evs.filter(e => e.tipo === 'venta'), e => e.dq);
      const devoluciones = sum(evs.filter(e => e.tipo === 'devventa' || e.tipo === 'devcompra'), e => e.dq);
      const ajustes = sum(evs.filter(e => e.tipo === 'ajuste'), e => e.dq);
      const perdidas = sum(evs.filter(e => e.tipo === 'merma'), e => e.dq);
      const fin = invAt(R, p.codigo, end);
      const costoU = fin.q > 1e-9 ? fin.v / fin.q : avgCost(R, p.codigo, end);
      return { codigo: p.codigo, nombre: p.nombre, categoria: p.categoria, unidad: p.unidad, qIni, entradas, salidas, devoluciones, ajustes, perdidas, existencia: fin.q, costoU, valor: fin.v, minimo: p.minimo || 0, vence: p.vence || '', estado: p.estado };
    });
  }

  /* ---------- Series para gráficos ---------- */
  function seriesDiarias(S, R, start, end, which) {
    const days = diffDays(end, start) + 1;
    const mensual = days > 62;
    const key = d => mensual ? d.slice(0, 7) : d;
    const map = {};
    const put = (d, v) => { if (d < start || d > end) return; const k = key(d); map[k] = r2((map[k] || 0) + v); };
    if (which === 'ventas') { R.ventas.forEach(v => put(v.fecha, v.base)); R.devs.filter(d => d.tipo === 'venta').forEach(d => put(d.fecha, -d.base)); }
    if (which === 'compras') { R.compras.forEach(c => put(c.fecha, c.base)); R.devs.filter(d => d.tipo === 'compra').forEach(d => put(d.fecha, -d.base)); }
    // completar días/meses sin movimiento
    const out = []; const cur = new Set(Object.keys(map));
    if (mensual) {
      let m = start.slice(0, 7); const last = end.slice(0, 7);
      while (m <= last) { out.push({ k: m, label: m.slice(5) + '/' + m.slice(2, 4), v: map[m] || 0 }); const [y, mm] = m.split('-').map(Number); m = mm === 12 ? (y + 1) + '-01' : y + '-' + pad(mm + 1); }
    } else {
      let d = start; while (d <= end) { out.push({ k: d, label: d.slice(8), v: map[d] || 0 }); d = addDays(d, 1); }
    }
    return out;
  }
  function topProductos(S, R, start, end, n) {
    const m = {};
    R.ventas.filter(v => v.fecha >= start && v.fecha <= end).forEach(v => v.lineas.forEach(l => {
      const o = m[l.codigo] || (m[l.codigo] = { codigo: l.codigo, nombre: (R.P[l.codigo] || {}).nombre || l.codigo, unidades: 0, ventas: 0, costo: 0 });
      o.unidades += l.cant; o.ventas += l.base; o.costo += l.cost;
    }));
    R.devs.filter(d => d.tipo === 'venta' && d.fecha >= start && d.fecha <= end).forEach(d => {
      const o = m[d.codigo]; if (o) { o.unidades -= d.cant; o.ventas -= d.base; o.costo -= d.cost; }
    });
    return Object.values(m).map(o => ({ ...o, ventas: r2(o.ventas), costo: r2(o.costo), ganancia: r2(o.ventas - o.costo), margen: o.ventas ? (o.ventas - o.costo) / o.ventas : 0 }))
      .sort((a, b) => b.unidades - a.unidades).slice(0, n || 8);
  }
  function evolucionUtilidad(S, R, end, nMeses) {
    const out = []; let m = end.slice(0, 7);
    const list = [];
    for (let i = 0; i < nMeses; i++) { list.unshift(m); const [y, mm] = m.split('-').map(Number); m = mm === 1 ? (y - 1) + '-12' : y + '-' + pad(mm - 1); }
    list.forEach(mm => { const s = mm + '-01', e = monthEnd(s); out.push({ k: mm, label: mm.slice(5) + '/' + mm.slice(2, 4), v: resultados(S, R, s, e).resultadoNeto }); });
    return out;
  }

  /* ---------- Cierre de caja ---------- */
  function cierreInfo(S, R, fecha) {
    const apertura = ledgerBal(R, 'Caja', addDays(fecha, -1));
    const dia = R.ledger.filter(e => e.date === fecha && e.cuenta === 'Caja');
    const por = {}; dia.forEach(e => { const k = e.tipo; por[k] = r2((por[k] || 0) + e.entrada - e.salida); });
    const esperado = ledgerBal(R, 'Caja', fecha);
    return { apertura, por, esperado };
  }

  /* ---------- Alertas ---------- */
  function alertas(S, R, hoy) {
    const cfg = S.config, out = [];
    const act = S.productos.filter(p => p.estado !== 'Inactivo');
    const inv = inventarioResumen(S, R, BEGIN, END).filter(x => x.estado !== 'Inactivo');
    const bajos = inv.filter(x => x.existencia > 1e-9 && x.minimo > 0 && x.existencia <= x.minimo);
    const agot = inv.filter(x => x.existencia <= 1e-9 && x.existencia >= -1e-9);
    const neg = inv.filter(x => x.existencia < -1e-9);
    const venc = inv.filter(x => x.vence && x.existencia > 1e-9 && x.vence < hoy);
    const prox = inv.filter(x => x.vence && x.existencia > 1e-9 && x.vence >= hoy && diffDays(x.vence, hoy) <= cfg.diasAlertaVence);
    const margNeg = act.map(p => {
      const rate = R.rateOf(p.codigo); const pb = (rate && R.incl) ? p.precio / (1 + rate) : p.precio; const c = avgCost(R, p.codigo);
      return { p, pb, c };
    }).filter(x => x.pb > 0 && x.c > 0 && x.pb < x.c - 1e-9);
    const cxp = docsAt(S, R, 'cxp', END, hoy).filter(d => d.saldo > 0.005);
    const cxpV = cxp.filter(d => d.vencimiento && d.vencimiento < hoy);
    const cxpP = cxp.filter(d => d.vencimiento && d.vencimiento >= hoy && diffDays(d.vencimiento, hoy) <= cfg.diasAlertaPago);
    const cxcV = docsAt(S, R, 'cxc', END, hoy).filter(d => d.saldo > 0.005 && d.vencimiento && d.vencimiento < hoy);
    const desc = S.cierres.filter(c => Math.abs(c.diferencia) >= 0.005).sort((a, b) => b.fecha.localeCompare(a.fecha));
    const dif = R.ajs.filter(a => a.tipo === 'Ajuste por conteo' && a.cant < 0).sort((a, b) => b.fecha.localeCompare(a.fecha));
    const desde = addDays(hoy, -30);
    const perd = R.ajs.filter(a => a.fecha >= desde && a.loss > 0 && a.cant < 0);
    const dup = []; const seen = {};
    S.pagos.forEach(p => { const k = p.docKey + '|' + p.monto + '|' + p.fecha; if (seen[k]) dup.push(p); seen[k] = 1; });

    if (neg.length) out.push({ nivel: 'alta', titulo: 'Existencia negativa', cant: neg.length, detalle: neg.map(x => x.nombre + ' (' + x.existencia + ')'), revisar: 'No puedes tener menos de cero. Revisa si vendiste algo que no habías registrado como compra, o si un registro de compra tiene fecha posterior a la venta.' });

/* ---------- gráficos SVG (sin internet) ---------- */
function compact(n) { const a = Math.abs(n); const s = a >= 1e6 ? (a / 1e6).toFixed(1) + 'M' : a >= 1e3 ? (a / 1e3).toFixed(a >= 1e4 ? 0 : 1) + 'k' : String(Math.round(a)); return (n < 0 ? '-' : '') + s; }
function barChart(data, o) {
  o = o || {}; const W = 600, H = 240, L = 54, Rr = 10, T = 12, B = 32;
  if (!data.length || data.every(d => !d.v)) return `<p class="muted" style="padding:30px 0;text-align:center">Sin datos en este período.</p>`;
  let mx = Math.max(0, ...data.map(d => d.v)), mn = Math.min(0, ...data.map(d => d.v)); if (mx === mn) mx = mn + 1;
  const step = (() => { const raw = (mx - mn) / 4, p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; })();
  const top = Math.ceil(mx / step) * step, bot = Math.floor(mn / step) * step;
  const y = v => T + (H - T - B) * (1 - (v - bot) / (top - bot));
  const bw = (W - L - Rr) / data.length, bwi = Math.max(2, Math.min(34, bw * 0.7));
  let g = ''; for (let v = bot; v <= top + 1e-9; v += step) g += `<line class="gl" x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}"/><text class="tx" x="${L - 5}" y="${y(v) + 4}" text-anchor="end">${compact(v)}</text>`;
  const every = Math.ceil(data.length / 12);
  const bars = data.map((d, i) => {
    const x = L + bw * i + (bw - bwi) / 2, y0 = y(0), y1 = y(d.v);
    if (!d.v) return (i % every === 0 ? `<text class="tx" x="${(x + bwi / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(d.label)}</text>` : '');
    return `<rect class="${d.v < 0 ? 'bar-neg' : (o.cls || 'bar-pos')}" x="${x.toFixed(1)}" y="${Math.min(y0, y1).toFixed(1)}" width="${bwi.toFixed(1)}" height="${Math.max(1, Math.abs(y0 - y1)).toFixed(1)}" rx="2"><title>${esc(d.label)}: ${money(d.v)}</title></rect>` +
      (i % every === 0 ? `<text class="tx" x="${(x + bwi / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(d.label)}</text>` : '');
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || 'Gráfico de barras')}">${g}<line class="axis" x1="${L}" x2="${W - Rr}" y1="${y(0)}" y2="${y(0)}"/>${bars}</svg>`;
}
function hbarChart(items, o) {
  o = o || {}; if (!items.length) return `<p class="muted" style="padding:30px 0;text-align:center">Sin datos en este período.</p>`;
  const W = 600, rowH = 32, L = 178, Rr = 96, H = items.length * rowH + 8; const mx = Math.max(...items.map(i => i.v), 1);
  const rows = items.map((it, i) => {
    const w = Math.max(2, (W - L - Rr) * it.v / mx), yy = 4 + i * rowH; const lbl = it.label.length > 21 ? it.label.slice(0, 20) + '…' : it.label;
    return `<text class="tx-b" x="${L - 8}" y="${yy + 19}" text-anchor="end">${esc(lbl)}</text><rect class="${o.cls || 'bar-pos'}" x="${L}" y="${yy + 4}" width="${w.toFixed(1)}" height="20" rx="3"><title>${esc(it.label)}: ${esc(it.text || money(it.v))}</title></rect><text class="tx-b" x="${(L + w + 6).toFixed(1)}" y="${yy + 18}">${esc(it.text || compact(it.v))}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || 'Gráfico de barras horizontales')}">${rows}</svg>`;
}

    if (x.vence && x.existencia > 0 && x.vence < h) st += ' ' + badge('Vencido', 'bad'); else if (x.vence && x.existencia > 0 && MNI.diffDays(x.vence, h) <= S.config.diasAlertaVence) st += ' ' + badge('Vence pronto', 'warn');
    return `<tr class="click" data-act="kardex" data-id="${esc(x.codigo)}"><td><b>${esc(x.codigo)}</b></td><td>${esc(x.nombre)}</td><td class="num">${qty(x.qIni)}</td><td class="num">${qty(x.entradas)}</td><td class="num">${qty(x.salidas)}</td><td class="num">${qty(x.devoluciones)}</td><td class="num">${qty(x.ajustes)}</td><td class="num">${qty(x.perdidas)}</td>
      <td class="num ${cls(x.existencia)}"><b>${qty(x.existencia)}</b></td><td class="num">${nf(x.costoU, 2)}</td><td class="num">${money(x.valor)}</td><td>${st}</td></tr>`;
  });
  const res = MNI.resultados(S, R, a, b); const prom = (res.invIni + res.invFin) / 2; const rot = prom > 0 ? res.costoVentas / prom : 0; const dias = rot > 0 ? (MNI.diffDays(b > h ? h : b, a) + 1) / rot : 0;
  const lim = MNI.addDays(h, -60); const vendidos = new Set(); R.ventas.filter(v => v.fecha >= lim).forEach(v => v.lineas.forEach(l => vendidos.add(l.codigo)));
  const lentos = MNI.inventarioResumen(S, R, MNI.BEGIN, MNI.END).filter(x => x.existencia > 0 && x.estado !== 'Inactivo' && !vendidos.has(x.codigo));
  return pageH('Control de inventario', 'Método de valoración: costo promedio ponderado móvil.', exportBtn('tInv', 'inventario')) +
    howto('Aquí no se digita nada: el inventario se calcula con tus compras, ventas, devoluciones y ajustes. Toca un producto para ver su historial (kardex). Las <b>Entradas</b> son compras, las <b>Salidas</b> son ventas y las <b>Pérdidas</b> son mercancía dañada o vencida.') + periodBar() +
    `<div class="grid kpis"><div class="kpi navy"><div class="l">Valor del inventario</div><div class="v">${money(total)}</div></div>
      <div class="kpi"><div class="l">Rotación del período</div><div class="v">${rot.toFixed(2)} veces</div><div class="s">costo de ventas ÷ inventario promedio</div></div>
      <div class="kpi"><div class="l">Días de inventario</div><div class="v">${dias ? dias.toFixed(1) : '—'}</div><div class="s">tiempo que tarda en venderse</div></div>
      <div class="kpi ${lentos.length ? 'warn' : ''}"><div class="l">Sin ventas en 60 días</div><div class="v">${lentos.length}</div><div class="s">${esc(lentos.slice(0, 3).map(x => x.nombre).join(', '))}</div></div></div>` +
    `<div class="bar">${searchBox('inv', 'Buscar producto…')}</div>` +
    tbl(['Código', 'Producto', ['Inv. inicial', 'num'], ['Entradas', 'num'], ['Salidas', 'num'], ['Devoluc.', 'num'], ['Ajustes', 'num'], ['Pérdidas', 'num'], ['Existencia actual', 'num'], ['Costo unit.', 'num'], ['Valor total', 'num'], 'Estado'], rows,
      { id: 'tInv', foot: `<tr><td colspan="10">Valor total del inventario</td><td class="num">${money(total)}</td><td></td></tr>` });
};

/* ---------- 6. Suplidores ---------- */

};

/* ---------- 7 y 8. Cuentas por pagar / cobrar ---------- */
function cuentas(tipo) {
  const h = hoyStr(); const isP = tipo === 'cxp';
  const all = MNI.docsAt(S, R, tipo, MNI.END, h);
  const fe = filters[tipo + '_est'] || 'abiertas';
  let list = all.filter(d => fe === 'todas' ? true : fe === 'abiertas' ? d.saldo > 0.005 : d.estado === fe);
  list = list.filter(d => match(tipo, (isP ? d.suplidor + ' ' + d.factura : d.cliente + ' ' + d.operacion))).sort((x, y) => (x.vencimiento || '9').localeCompare(y.vencimiento || '9'));
  const rows = list.map(d => {
    const bk = d.estado === 'Pagada' ? 'ok' : d.estado === 'Vencida' ? 'bad' : d.estado === 'Abonada' ? 'info' : 'warn';
    const dias = d.saldo > 0.005 && d.dias !== null ? (d.dias < 0 ? `<span class="neg">${-d.dias} d. de atraso</span>` : d.dias + ' d.') : '';
    return `<tr><td><b>${esc(isP ? d.suplidor : d.cliente)}</b></td><td>${esc(isP ? d.factura : d.operacion)}</td><td>${fdate(d.fecha)}</td><td>${fdate(d.vencimiento)}</td><td class="num">${money(d.total)}</td><td class="num">${money(d.abonos)}</td><td class="num ${d.saldo > 0.005 ? 'neg' : ''}"><b>${money(d.saldo)}</b></td><td>${badge(d.estado, bk)}</td><td>${dias}</td>
      <td class="noprint" style="white-space:nowrap">${d.saldo > 0.005 ? btn(isP ? 'pagar' : 'cobrar', isP ? 'Abonar / pagar' : 'Cobrar', { key: d.key, tipo }, 'sm') : ''}${d.tipo === 'saldo inicial' ? ' ' + btn('ini-del', 'Borrar', { key: d.key, tipo }, 'danger sm') : ''}</td></tr>`;
  });
  const abiertas = all.filter(d => d.saldo > 0.005);
  const totSaldo = abiertas.reduce((s, d) => s + d.saldo, 0), totV = abiertas.filter(d => d.estado === 'Vencida').reduce((s, d) => s + d.saldo, 0);
  const regs = (isP ? S.pagos : S.cobros).slice().sort((x, y) => y.fecha.localeCompare(x.fecha) || y.id - x.id);
  const nameOf = k => { const d = all.find(x => x.key === k); return d ? (isP ? d.suplidor + ' · fact. ' + d.factura : d.cliente + ' · ' + d.operacion) : k; };
  const regRows = regs.slice(0, 60).map(p => `<tr><td>${fdate(p.fecha)}</td><td>${esc(nameOf(p.docKey))}</td><td>${esc(p.medio)}</td><td class="num">${money(p.monto)}</td><td class="noprint">${btn('reg-del', 'Borrar', { id: p.id, tipo }, 'danger sm')}</td></tr>`);
  const est = ['abiertas', 'todas', 'Pendiente', 'Abonada', 'Vencida', 'Pagada'];
  return pageH(isP ? 'Cuentas por pagar' : 'Cuentas por cobrar', isP ? 'Lo que le debes a tus suplidores.' : 'Lo que te deben tus clientes (fiaos).', btn('ini-new', isP ? '+ Deuda anterior' : '+ Fiao anterior', { tipo }, 'sec') + exportBtn('t_' + tipo, tipo)) +
    howto(isP ? 'Las compras <b>a crédito</b> aparecen solas aquí. Cuando pagues, toca <b>Abonar / pagar</b>: el sistema descuenta el saldo y evita pagar más de lo que debes. Pagar una factura no es un gasto. Las facturas vencidas se marcan en rojo.' : 'Las ventas <b>a crédito</b> aparecen solas aquí. Cuando el cliente pague, toca <b>Cobrar</b>. El cobro no es una venta nueva: solo cambia lo que te deben por dinero.') +
    `<div class="grid kpis"><div class="kpi ${totSaldo > 0 ? 'warn' : ''}"><div class="l">Saldo total pendiente</div><div class="v">${money(totSaldo)}</div><div class="s">${abiertas.length} documentos abiertos</div></div><div class="kpi ${totV > 0 ? 'bad' : ''}"><div class="l">Vencido</div><div class="v">${money(totV)}</div></div></div>` +
    `<div class="bar">${searchBox(tipo, isP ? 'Buscar suplidor o factura…' : 'Buscar cliente u operación…')}<select data-filter-sel="${tipo}_est" aria-label="Estado">${est.map(e => `<option value="${e}" ${fe === e ? 'selected' : ''}>${e === 'abiertas' ? 'Solo con saldo' : e === 'todas' ? 'Todas' : e}</option>`).join('')}</select></div>` +
    tbl([isP ? 'Suplidor' : 'Cliente', isP ? 'Factura' : 'Operación', 'Emisión', 'Vencimiento', ['Importe original', 'num'], [isP ? 'Abonos' : 'Cobros', 'num'], ['Saldo pendiente', 'num'], 'Estado', 'Plazo', ''], rows, { id: 't_' + tipo, empty: isP ? 'No tienes facturas por pagar con este filtro.' : 'No tienes cuentas por cobrar con este filtro.' }) +
    `<h2 style="margin:22px 0 8px">${isP ? 'Pagos y abonos registrados' : 'Cobros registrados'}</h2>` + tbl(['Fecha', 'Documento', 'Medio', ['Monto', 'num'], ''], regRows, { empty: 'Todavía no hay registros.' });
}
views.cxp = () => cuentas('cxp'); views.cxc = () => cuentas('cxc');

  let run = MNI.ledgerBal(R, cf === 'Todas' ? null : cf, MNI.addDays(a, -1));
  const rows = L.map(e => { run = MNI.r2(run + e.entrada - e.salida); return `<tr><td>${fdate(e.date)}</td><td>${esc(e.concepto)}</td><td class="num">${e.entrada ? money(e.entrada) : ''}</td><td class="num">${e.salida ? money(e.salida) : ''}</td><td>${esc(e.tipo)}</td><td>${esc(e.medio)}</td><td>${esc(e.cuenta)}</td><td class="num ${cls(run)}">${money(run)}</td></tr>`; });

    howto('Las ventas, compras de contado, cobros, pagos y gastos aparecen solos. Aquí registras lo demás: <b>aportes</b> y <b>retiros del dueño</b>, préstamos, depósitos al banco y otros ingresos. Un retiro del dueño <b>no es un gasto</b>. Al final del día usa el <b>Cierre de caja</b>.') + periodBar() +
    `<div class="grid kpis"><div class="kpi"><div class="l">Efectivo en caja</div><div class="v ${cls(caja)}">${money(caja)}</div><div class="s">al ${fdate(b > MNI.END ? h : b)}</div></div><div class="kpi navy"><div class="l">Saldo en banco</div><div class="v ${cls(banco)}">${money(banco)}</div></div>
      <div class="kpi"><div class="l">Entradas del período</div><div class="v">${money(te)}</div></div><div class="kpi warn"><div class="l">Salidas del período</div><div class="v">${money(ts)}</div></div></div>` +
    `<div class="card"><h2>Cierre de caja</h2><div class="fg"><div class="f"><label for="cf">Fecha</label><input type="date" id="cf" data-cierre="fecha" value="${esc(fcierre)}"></div>

      <div class="f"><label>Efectivo esperado al cierre</label><input value="${nf(ci.esperado, 2)}" readonly></div>
      <div class="f"><label for="cc">Efectivo contado</label><input type="number" step="0.01" id="cc" value="${saved ? saved.contado : ''}" placeholder="Cuenta el efectivo y escríbelo"></div></div>
      ${porRows ? `<div class="tw" style="margin-top:10px"><table><thead><tr><th>Movimientos de caja de ese día</th><th class="num">Neto</th></tr></thead><tbody>${porRows}</tbody></table></div>` : '<p class="muted">Sin movimientos de caja ese día.</p>'}
      <div class="bar" style="margin-top:10px"><input id="cn" placeholder="Nota (opcional)" value="${esc(saved ? saved.nota : '')}" style="flex:1"> ${btn('cierre-save', 'Guardar cierre')}</div>
      ${saved ? notice(Math.abs(saved.diferencia) < 0.005 ? '<b>Cuadrado.</b> No hay diferencia.' : `<b>${saved.diferencia < 0 ? 'Faltante' : 'Sobrante'} de ${money(Math.abs(saved.diferencia))}</b> en el cierre de ese día. Revisa cambios mal dados, gastos o retiros sin anotar.`, Math.abs(saved.diferencia) < 0.005 ? 'ok' : 'bad') : ''}</div>` +

    `<div class="two"><div>${searchBox('gas', 'Buscar gasto…')}<div style="height:10px"></div>${tbl(['Fecha', 'Concepto', 'Categoría', 'Tipo', 'Pagado con', ['Monto', 'num'], ''], rows, { id: 'tGas', foot: `<tr><td colspan="5">Total</td><td class="num">${money(res.gastosOp)}</td><td></td></tr>`, empty: 'No hay gastos en este período.' })}</div>

/* ---------- Ajustes y devoluciones ---------- */
views.ajustes = function () {
  const tab = ui.tab.aj || 'dev'; const [a, b] = range();
  const devs = R.devs.filter(d => inRange(d.fecha, a, b)).sort((x, y) => y.fecha.localeCompare(x.fecha));
  const dRows = devs.map(d => `<tr><td>${fdate(d.fecha)}</td><td>${d.tipo === 'venta' ? badge('De venta', 'info') : badge('De compra', 'warn')}</td><td>${esc(d.tipo === 'venta' ? d.v.operacion : d.c.factura)}</td><td>${esc(d.codigo)} · ${esc((R.P[d.codigo] || {}).nombre || '')}</td><td class="num">${qty(d.cant)}</td><td class="num">${money(d.total)}</td><td>${esc(d.destino)}</td><td>${esc(d.motivo || '')}</td><td class="noprint">${btn('dev-del', 'Borrar', { id: d.id }, 'danger sm')}</td></tr>`);
  const ajs = R.ajs.filter(x => inRange(x.fecha, a, b)).sort((x, y) => y.fecha.localeCompare(x.fecha));
  const aRows = ajs.map(x => `<tr><td>${fdate(x.fecha)}</td><td>${x.tipo === 'Ajuste por conteo' ? badge(x.tipo, 'info') : badge(x.tipo, 'bad')}</td><td>${esc(x.codigo)} · ${esc((R.P[x.codigo] || {}).nombre || '')}</td><td class="num ${cls(x.cant)}">${qty(x.cant)}</td><td class="num ${cls(-x.loss)}">${money(x.cost)}</td><td>${esc(x.motivo || '')}</td><td class="noprint">${btn('aj-del', 'Borrar', { id: x.id }, 'danger sm')}</td></tr>`);
  return pageH('Ajustes, pérdidas y devoluciones', 'Todo lo que cambia el inventario sin ser una compra ni una venta normal.', btn('dev-new', '+ Devolución', {}, 'sec') + btn('aj-new', '+ Merma / ajuste')) +
    howto('<b>Devolución:</b> un cliente te devuelve algo (baja la venta y la mercancía regresa) o tú devuelves algo a un suplidor (baja la compra y tu deuda). <b>Merma:</b> mercancía dañada, vencida o perdida; sale del inventario y se cuenta como pérdida. Siempre indica el motivo.') + periodBar() +
    `<div class="bar noprint"><button class="btn ${tab === 'dev' ? '' : 'sec'}" data-act="tab" data-k="aj" data-v="dev">Devoluciones (${devs.length})</button><button class="btn ${tab === 'aj' ? '' : 'sec'}" data-act="tab" data-k="aj" data-v="aj">Mermas y ajustes (${ajs.length})</button></div>` +
    (tab === 'dev' ? tbl(['Fecha', 'Tipo', 'Documento', 'Producto', ['Cant.', 'num'], ['Valor', 'num'], 'Destino', 'Motivo', ''], dRows, { empty: 'No hay devoluciones en este período.' })
      : tbl(['Fecha', 'Tipo', 'Producto', ['Cantidad', 'num'], ['Costo', 'num'], 'Motivo', ''], aRows, { empty: 'No hay mermas ni ajustes en este período.' }));
};

/* ---------- 11. Estado de resultados ---------- */
views.resultados = function () {
  const [a, b] = range(); const r = MNI.resultados(S, R, a, b);
  const row = (l, v, c, ind) => `<tr class="${c || ''}"><td class="${ind ? 'ind' : ''}">${l}</td><td class="num ${c ? cls(v) : ''}">${money(v)}</td></tr>`;

  return pageH('Estado de resultados', 'Cuánto ganaste de verdad en el período.', btn('print', 'Imprimir', {}, 'sec')) +
    howto('Este estado se arma solo. La <b>utilidad</b> sale de aquí (ventas − costo de ventas − gastos); nunca de restar lo que tienes menos lo que debes. Los retiros del dueño no aparecen porque no son gastos.') + periodBar() +
    `<div class="two"><div class="card"><table class="stmt"><tbody>
      ${row('Ventas brutas', r.ventasBrutas)}${row('(−) Descuentos sobre ventas', -r.descVentas, '', 1)}${row('(−) Devoluciones de ventas', -r.devVentas, '', 1)}${row('(=) VENTAS NETAS', r.ventasNetas, 'sub')}
      ${row('Inventario inicial', r.invIni, '', 1)}${row('(+) Compras brutas', r.comprasBrutas, '', 1)}${row('(−) Descuentos recibidos', -r.descCompras, '', 1)}${row('(+) Costos adicionales (fletes)', r.adicionales, '', 1)}${row('(−) Devoluciones de compras', -r.devCompras, '', 1)}${row('(−) Inventario final', -r.invFin, '', 1)}

function closeModal() { $('#modalRoot').innerHTML = ''; }

function confirmBox(msg, o) {
  o = o || {};
  return new Promise(res => {
    const root = $('#confirmRoot');
    root.innerHTML = `<div class="modal-bg" style="z-index:80"><div class="modal" role="alertdialog" aria-modal="true" style="max-width:480px"><header><h2>${esc(o.title || 'Confirmar')}</h2></header><div class="body"><p style="margin:0;white-space:pre-line">${msg}</p></div><footer><button class="btn sec" data-c="0">${o.no || 'Cancelar'}</button><button class="btn ${o.danger ? 'danger' : ''}" data-c="1" id="cbOk">${o.ok || 'Aceptar'}</button></footer></div></div>`;

/* ---------- aplicar cambios con validaciones ---------- */
function checkDocs(S2, R2) {
  const h = hoyStr();
  for (const t of ['cxp', 'cxc']) {
    const bad = MNI.docsAt(S2, R2, t, MNI.END, h).find(d => d.saldo < -0.005);
    if (bad) return 'Este movimiento deja un saldo negativo (' + money(bad.saldo) + ') en ' + (t === 'cxp' ? 'la factura ' + bad.factura + ' de ' + bad.suplidor : 'la operación ' + bad.operacion) + '. Revisa los montos.';
  }
  if (R2.errors.length > R.errors.length) return 'El registro es inconsistente: ' + R2.errors[R2.errors.length - 1];
  return '';
}
async function apply(mutate, o) {
  o = o || {};
  const S2 = clone(S); const r = mutate(S2); if (typeof r === 'string') return r;
  const R2 = MNI.compute(S2); const err = checkDocs(S2, R2); if (err) return err;
  let autorizada = false;
  if (o.guardNeg !== false) {
    const nn = MNI.newNegatives(MNI.negSummary(R), MNI.negSummary(R2));
    if (nn.length) {
      const lines = nn.map(n => '• ' + n.codigo + ' ' + ((R2.P[n.codigo] || {}).nombre || '') + ': quedaría en ' + qty(n.q)).join('\n');
      const ok = await confirmBox('<b>Advertencia: existencia negativa.</b>\nEste movimiento dejaría el inventario por debajo de cero:\n' + lines + '\n\nNo se puede tener menos de cero. Normalmente significa que falta registrar una compra, o que la fecha está mal.\n\n¿Autorizas registrarlo de todas formas? Quedará marcado y aparecerá en las alertas hasta que lo corrijas.', { title: 'Existencia negativa', ok: 'Autorizo registrarlo', no: 'Volver y corregir', danger: true });
      if (!ok) return false; autorizada = true;
    }
  }
  if (autorizada && o.mark) o.mark(S2);
  S = S2; recompute(); saveState(); render(); if (o.msg) toast(o.msg);
}
const uniq = (arr, f) => { const s = new Set(); return arr.filter(x => { const k = f(x); if (s.has(k)) return false; s.add(k); return true; }); };

      <div class="f"><label for="d_forma">Forma de cobro *</label><select id="d_forma" name="forma"><option>Efectivo</option><option>Transferencia</option><option>Tarjeta</option><option>Crédito</option></select></div>

      <div class="f f-venc" hidden><label for="d_venc">Debe pagar el *</label><input id="d_venc" name="vencimiento" type="date" value="${MNI.addDays(h, 15)}"></div></div>`;
  const body = head + `<div class="tw" style="margin-top:12px"><table class="lines"><thead><tr><th>Producto</th><th>Cantidad</th><th>${isC ? 'Costo unit.' : 'Precio unit.'}</th><th>Descuento (RD$)</th>${isC ? '<th>Flete u otros (RD$)</th>' : ''}<th>Total línea</th><th></th></tr></thead><tbody id="lbody">${lrow()}${lrow()}</tbody></table></div>
    <div class="bar" style="margin-top:8px"><button type="button" class="btn sec sm" data-act="line-add">+ Agregar línea</button><span class="grow"></span><span>Total estimado: <b id="dtot">${money(0)}</b></span></div>
    <p class="muted" style="margin:6px 0 0;font-size:13px">${isC ? 'El descuento y el flete son montos totales de esa línea. El sistema reparte el costo real al producto.' : 'El descuento es el monto total rebajado en esa línea.'}${S.config.itbis.activo ? ' Escribe precios y costos ' + (S.config.itbis.incluido ? '<b>con</b>' : '<b>sin</b>') + ' ITBIS, como lo definiste en Parámetros.' : ''}</p>`;
  const recalc = form => {
    let tot = 0;
    $$('.lrow', form).forEach(tr => {
      const g = n => { const e = tr.querySelector('[name=' + n + ']'); return e ? parseFloat(e.value) || 0 : 0; };
      const t = g('cant') * g(isC ? 'costo' : 'precio') - g('descuento') + g('adicional'); tot += t; tr.querySelector('.t').textContent = nf(t, 2);
      const code = tr.querySelector('[name=codigo]').value; const d = tr.querySelector('.disp');
      if (d) d.textContent = (!isC && code) ? 'Disponible: ' + qty(MNI.invAt(R, code, MNI.END).q) : '';
    }); $('#dtot').textContent = money(tot);
  };
  openShell({
    title: isC ? 'Registrar compra' : 'Registrar venta', body, wide: true, ok: 'Guardar ' + (isC ? 'compra' : 'venta'),
    onOpen: form => {
      const toggle = () => {
        const f = form.elements.forma.value;
        if (isC) { $('.f-medio', form).hidden = f !== 'Contado'; $('.f-venc', form).hidden = f !== 'Crédito'; if (f === 'Crédito' && !form.elements.vencimiento.value) { const o = form.elements.suplidor.selectedOptions[0]; form.elements.vencimiento.value = MNI.addDays(form.elements.fecha.value || h, parseInt(o.dataset.dias, 10) || 30); } }
        else { $('.f-cli', form).hidden = f !== 'Crédito'; $('.f-venc', form).hidden = f !== 'Crédito'; }
      };
      form.addEventListener('change', e => {
        if (e.target.name === 'forma' || e.target.name === 'suplidor' || e.target.name === 'fecha') { if (e.target.name !== 'forma' && isC) form.elements.vencimiento.value = ''; toggle(); }

    onSubmit: form => {
      const g = n => form.elements[n] ? String(form.elements[n].value).trim() : '';
      const fecha = g('fecha'); if (!fecha) return 'Falta la fecha.';
      const lineas = []; const seen = new Set();
      for (const tr of $$('.lrow', form)) {
        const code = tr.querySelector('[name=codigo]').value; const rv = n => { const e = tr.querySelector('[name=' + n + ']'); return e && e.value !== '' ? parseFloat(e.value) : 0; };
        const hasAny = code || rv('cant') || rv(isC ? 'costo' : 'precio'); if (!hasAny) continue;
        if (!code) return 'Una línea no tiene producto.'; if (seen.has(code)) return 'El producto ' + code + ' está repetido. Junta las cantidades en una sola línea.'; seen.add(code);
        const cant = rv('cant'), pr = rv(isC ? 'costo' : 'precio'), desc = rv('descuento'), adic = rv('adicional');
        if (!(cant > 0)) return 'La cantidad de ' + code + ' debe ser mayor que cero.'; if (pr < 0) return 'El ' + (isC ? 'costo' : 'precio') + ' de ' + code + ' no puede ser negativo.';
        if (desc < 0 || adic < 0) return 'Descuento y costos adicionales no pueden ser negativos.'; if (desc > cant * pr + 0.005) return 'El descuento de ' + code + ' es mayor que el valor de la línea.';
        lineas.push(isC ? { codigo: code, cant, costo: pr, descuento: desc, adicional: adic } : { codigo: code, cant, precio: pr, descuento: desc });
      }
      if (!lineas.length) return 'Agrega al menos un producto.';
      const forma = g('forma'); const venc = g('vencimiento');
      if (forma === 'Crédito') { if (!venc) return 'Indica la fecha de vencimiento.'; if (venc < fecha) return 'El vencimiento no puede ser anterior a la fecha del documento.'; }
      if (isC) {
        const factura = g('factura'); if (!factura) return 'Falta el número de factura.'; const sup = g('suplidor');
        if (S.compras.some(c => c.suplidor === sup && c.factura.toLowerCase() === factura.toLowerCase())) return 'La factura ' + factura + ' de ' + sup + ' ya fue registrada. Se bloquea para evitar duplicarla.';
        return apply(s => { s.compras.push({ id: MNI.nextId(s), fecha, factura, suplidor: sup, forma, medio: forma === 'Contado' ? g('medio') : '', vencimiento: forma === 'Crédito' ? venc : '', lineas }); }, { msg: 'Compra registrada. El inventario se actualizó.', guardNeg: false });
      }
      const operacion = g('operacion'); if (!operacion) return 'Falta el número de operación.';
      if (S.ventas.some(v => v.operacion.toLowerCase() === operacion.toLowerCase())) return 'La operación ' + operacion + ' ya existe.';
      const cliente = g('cliente'); if (forma === 'Crédito' && !cliente) return 'Para vender a crédito escribe el nombre del cliente.';
      let id; return apply(s => { id = MNI.nextId(s); s.ventas.push({ id, fecha, operacion, cliente: forma === 'Crédito' ? cliente : '', forma, vencimiento: forma === 'Crédito' ? venc : '', lineas }); }, { msg: 'Venta registrada. Se descontó del inventario.', mark: s => { s.ventas.find(v => v.id === id).autorizada = true; } });
    },
  });
}

function conteoTotals() {
  const f = S.conteo.fecha || hoyStr(); let tv = 0, n = 0;
  $$('#tConteo tbody tr').forEach(tr => {
    const inp = tr.querySelector('.cinp'); const code = inp.dataset.cod; const has = inp.value !== '';
    const reg = MNI.invAt(R, code, f).q; const dif = has ? parseFloat(inp.value) - reg : 0; const cu = MNI.avgCost(R, code, f); const vd = MNI.r2(dif * cu);
    const tds = tr.querySelectorAll('td'); tds[4].textContent = has ? qty(dif) : ''; tds[4].className = 'num ' + cls(dif); tds[6].textContent = has ? money(vd) : ''; tds[6].className = 'num ' + cls(vd);
    if (has) { tv += vd; if (Math.abs(dif) > 1e-9) n++; }
  });
  const ft = $('#tConteo tfoot tr'); if (ft) ft.innerHTML = `<td colspan="6">${n} productos con diferencia</td><td class="num ${cls(tv)}">${money(tv)}</td><td></td>`;
}
async function conteoApply() {

  if (!(await confirmBox(`Se crearán <b>${items.length}</b> ajustes por conteo, con fecha ${fdate(f)}, por un valor neto de <b>${money(tv)}</b>.\nDespués, el inventario registrado será igual a lo que contaste.\n\nInvestiga primero el porqué de las diferencias. ¿Aplicar?`, { ok: 'Aplicar ajustes', no: 'Todavía no' }))) return;
  const err = await apply(s => { items.forEach(x => s.ajustes.push({ id: MNI.nextId(s), fecha: f, codigo: x.p.codigo, tipo: 'Ajuste por conteo', cant: x.dif, motivo: 'Conteo físico del ' + fdate(f) + (x.obs ? ' · ' + x.obs : '') })); s.conteo.items = {}; }, { msg: 'Ajustes aplicados. Inventario actualizado.', guardNeg: false });
